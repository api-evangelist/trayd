name: Trayd
description: Trayd is a construction payroll, HR, and compliance platform built for commercial trade
  contractors and subcontractors. It automates certified and prevailing-wage payroll, union and
  multi-state compliance reporting, field and labor tracking, crew scheduling and dispatch, HR
  onboarding and benefits, and offers same-day pay, moving tens of millions of payroll dollars each
  week. Founded in 2022 (Y Combinator S23) and backed by Bloomberg Beta, Trayd operates a
  private SaaS and mobile application with no public developer API, documentation, or integration
  surface published at this time.
